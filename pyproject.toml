[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "judged-useless"
version = "1.0.0"
description = "Measure whether a tool-using agent stops on its own evidence judgments (time-matched contrast), and enforce the integration step."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
experiments = ["vllm>=0.6", "anthropic>=0.40"]   # only to run agents in experiments/

[project.urls]
Paper = "https://arxiv.org/abs/2610.06191"
Repository = "https://github.com/bennidict23/judged-useless-queried-anyway"

[tool.setuptools]
packages = ["judged_useless"]
